name: Validate MCP server

on:
  push:
    branches:
      - main
      - feature/asset-pipeline-foundation
  pull_request:
    branches:
      - main

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
